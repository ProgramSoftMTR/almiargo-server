name: Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'URL WebSocket incluida en el APK (wss://...)'
        required: false
        default: ''

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SERVER_URL: ${{ github.event.inputs.server_url || vars.VITE_SERVER_URL }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Platform 35 y Build-Tools 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build web
        run: npm run build

      - name: Preparar proyecto Android
        run: node scripts/android-setup.mjs

      - name: Sincronizar Capacitor
        working-directory: client
        run: npx cap sync android

      - name: Gradle assembleDebug
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: almiargo-online-debug-apk
          path: client/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
